<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a0d2e" />
  <title>Sanrı — Çevrimdışı</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse 120% 80% at 50% 0%, #2d1b4e 0%, #0d0818 45%, #070510 100%);
      color: rgba(230, 220, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 16px;
      padding: 28px 24px;
      background: rgba(10, 6, 20, 0.65);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.12);
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 12px; letter-spacing: 0.04em; }
    p { margin: 0; font-size: 0.95rem; line-height: 1.55; color: rgba(200, 190, 230, 0.85); }
    a {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
    }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Çevrimdışısın</h1>
    <p>
      Ağ yokken önbelleğe alınmış sayfalar ve satın alınmış içerikler açılabilir.
      Bağlantı gelince uygulama kendini güncelleyecektir.
    </p>
    <a href="/">Sanrı’ya dön</a>
  </div>
</body>
</html>
